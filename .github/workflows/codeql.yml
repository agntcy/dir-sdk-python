name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "42 5 * * 6"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          echo "📦 Installing Python dependencies..."
          # Install dependencies for Python SDK
          if [ -f "pyproject.toml" ]; then
            pip install -e . || echo "Failed to install Python SDK"
          fi
          # Install dependencies for examples
          if [ -f "examples/requirements.txt" ]; then
            cd examples
            pip install -r requirements.txt || echo "Failed to install example requirements"
            cd ..
          fi
          echo "✅ Python dependencies installed"

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: python
          build-mode: none
          queries: +security-extended,security-and-quality
          config: |
            name: "CodeQL Config"
            queries:
              - uses: security-extended
              - uses: security-and-quality
            query-filters:
              - exclude:
                  # Helm values files use empty strings as defaults
                  id: js/empty-password-in-configuration-file
            paths-ignore:
              - "**/*_pb2.py"
              - "**/*_pb2_grpc.py"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:python"
