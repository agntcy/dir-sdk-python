name: Test SDK

on:
  workflow_call:
    inputs:
      dir_chart_version:
        required: false
        type: string
        description: "Override the version of the dir Helm chart to install for the tests."
      dirctl_image_tag:
        required: false
        type: string
        description: "Override the tag of the dir-ctl Docker image to use in the tests."

permissions:
  id-token: write
  contents: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Login to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: notused
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Add dependencies for SDKs testing
        env:
          CLIENT_ID: "https://github.com/${{ github.repository }}/.github/workflows/reusable-test-sdk.yaml@${{ github.ref }}"
        run: |
          task deps:cicd:iodc-token-generation >> $GITHUB_ENV

      - name: Test Python SDK
        env:
          DIR_CHART_VERSION: ${{ inputs.dir_chart_version }}
          DIRCTL_IMAGE_TAG: ${{ inputs.dirctl_image_tag }}
        run: |
          task test
