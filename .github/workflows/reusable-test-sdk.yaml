name: Test SDK

on:
  workflow_call:
    inputs:
      dir_chart_version:
        required: false
        type: string
        description: "Override the version of the dir Helm chart to install for the tests."
      dirctl_image_tag:
        required: false
        type: string
        description: "Override the tag of the dir-ctl Docker image to use in the tests."
      sdk_ref:
        required: false
        type: string
        description: "Git ref (branch, tag, or SHA) of agntcy/dir-sdk-python to test. When omitted, resolved automatically."

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      # Cross-repo callers (e.g. agntcy/csit) need GITHUB_TOKEN with contents:read on this repo.
      - name: Resolve SDK ref
        id: sdk-ref
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.sdk_ref }}" ]; then
            ref="${{ inputs.sdk_ref }}"
          elif [ "${{ github.repository }}" = "agntcy/dir-sdk-python" ]; then
            ref="${{ github.sha }}"
          else
            ref="main"
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: agntcy/dir-sdk-python
          ref: ${{ steps.sdk-ref.outputs.ref }}
          fetch-depth: 0

      - name: Login to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: notused
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0

      - name: Add dependencies for SDKs testing
        env:
          CLIENT_ID: "https://github.com/agntcy/dir-sdk-python/.github/workflows/reusable-test-sdk.yaml@${{ steps.sdk-ref.outputs.ref }}"
        run: |
          task deps:cicd:iodc-token-generation >> $GITHUB_ENV

      - name: Test Python SDK
        env:
          DIR_CHART_VERSION: ${{ inputs.dir_chart_version }}
          DIRCTL_IMAGE_TAG: ${{ inputs.dirctl_image_tag }}
        run: |
          task test
